# MinIO development server for MyJuliaToolbox
#
# Usage:
#   docker compose -f docker-compose.minio.yml up -d
#   docker compose -f docker-compose.minio.yml down
#
# After starting:
#   API endpoint : http://localhost:9000
#   Web console  : http://localhost:9001  (admin / minioadmin — change in production!)
#
# Credentials are read from .env if present; defaults are shown below.
# NEVER use the default credentials outside a local dev environment.

services:
  minio:
    image: minio/minio:latest
    container_name: minio-dev
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # Web admin console
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Optional: enable per-bucket versioning support
      # MINIO_VERSIONING: "enabled"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot container that creates a default bucket on first startup.
  # Remove this service once the bucket exists.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000
          ${MINIO_ROOT_USER:-minioadmin}
          ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/analytics &&
        echo 'Bucket ready.'
      "

volumes:
  minio_data:
